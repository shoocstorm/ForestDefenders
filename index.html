<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Forest Defender: Mushroom Mayhem</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1410;
        touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* --- Boot / loading overlay --- */
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 35%, #1a3326, #0b1410 70%);
        font-family: "Trebuchet MS", system-ui, sans-serif; color: #cdebb6;
        z-index: 50; transition: opacity 0.6s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: 34px; letter-spacing: 1px; text-shadow: 0 2px 12px #000a; }
      #boot .sub { font-size: 14px; opacity: 0.7; }
      #boot .hint { font-size: 13px; opacity: 0.55; margin-top: 8px; }
      #boot .spinner {
        width: 42px; height: 42px; border: 4px solid #2e5d3e; border-top-color: #a8e063;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* --- Debug stats --- */
      #stats {
        position: fixed; top: 8px; left: 8px; z-index: 20;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
        color: #a8e063; text-shadow: 0 1px 3px #000c; pointer-events: none;
        line-height: 1.5; white-space: pre;
      }
      /* --- Controls help --- */
      #help {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
        z-index: 20; font-family: "Trebuchet MS", system-ui, sans-serif;
        font-size: 12.5px; color: #d7f0c2; text-shadow: 0 1px 3px #000c;
        background: #0b141066; padding: 6px 14px; border-radius: 20px;
        border: 1px solid #ffffff1a; pointer-events: none; text-align: center;
      }

      /* --- Touch devices: hide desktop key hints, lock the canvas to no-scroll --- */
      @media (pointer: coarse) {
        #help { display: none; }
      }

      /* --- Rotate-to-landscape prompt (portrait phones only) --- */
      #rotate {
        position: fixed; inset: 0; z-index: 60; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: radial-gradient(circle at 50% 40%, #1a3326, #0b1410 75%);
        font-family: "Trebuchet MS", system-ui, sans-serif; color: #cdebb6; text-align: center;
        padding: 24px;
      }
      #rotate .glyph { font-size: 56px; animation: rot 1.8s ease-in-out infinite; }
      #rotate h2 { font-size: 22px; letter-spacing: 1px; }
      #rotate p { font-size: 14px; opacity: 0.7; }
      @keyframes rot { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }

      /* --- Landing / level-select screen --- */
      #landing {
        position: fixed; inset: 0; z-index: 55; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        background: radial-gradient(circle at 50% 30%, #1a3326, #0b1410 72%);
        font-family: "Trebuchet MS", system-ui, sans-serif; color: #cdebb6;
        padding: 24px; text-align: center;
      }
      #landing.show { display: flex; }
      #landing h1 { font-size: 40px; letter-spacing: 1px; text-shadow: 0 2px 14px #000a; }
      #landing .sub { font-size: 15px; opacity: 0.7; margin-bottom: 22px; }
      #landing .levels {
        display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 720px;
      }
      #landing .level {
        cursor: pointer; width: 200px; padding: 20px 18px; border-radius: 14px;
        background: #ffffff10; border: 1px solid #ffffff22; color: #e8ffd4;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      #landing .level:hover {
        transform: translateY(-4px); background: #a8e0631f; border-color: #a8e063aa;
      }
      #landing .level .num { font-size: 13px; opacity: 0.6; letter-spacing: 2px; }
      #landing .level .name { font-size: 21px; margin-top: 6px; font-weight: bold; }
      #landing .level .desc { font-size: 12.5px; opacity: 0.65; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stats"></div>
    <div id="help">WASD move · Shift run · Space jump (×2) · Click/Z fire · 1-9/Q weapon · V kick · R tail · E free animal · Mouse look · C camera</div>
    <div id="rotate">
      <div class="glyph">📱</div>
      <h2>Rotate your device</h2>
      <p>Forest Defender plays best in landscape.</p>
    </div>
    <div id="landing">
      <h1>🌰 Forest Defender</h1>
      <div class="sub">Mushroom Mayhem · Select a level</div>
      <div class="levels"></div>
    </div>
    <div id="boot">
      <h1>🌰 Forest Defender</h1>
      <div class="sub">Mushroom Mayhem</div>
      <div class="spinner"></div>
      <div class="hint">Loading…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
